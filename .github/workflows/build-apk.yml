name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flet-dev/flet-build-action@v1
        id: build
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          extra-args: "--split-per-abi"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ steps.build.outputs.archive-path }}

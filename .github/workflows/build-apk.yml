name: Build Flet APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ Не удалось прочитать version из pyproject.toml"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Версия: $VERSION, тег: $TAG"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4 flet-cli

      - name: Configure Git
        run: git config --global --add safe.directory '*'

      - name: Build APK (all architectures)
        run: |
          flet build apk --python-version 3.12 --split-per-abi --verbose --no-rich-output

      - name: Collect APK files
        run: |
          mkdir -p dist
          find build -name "*.apk" -type f -exec cp {} dist/ \;
          echo "=== Найдены APK: ==="
          ls -la dist/
          COUNT=$(ls -1 dist/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ APK не найдены"
            exit 1
          fi

      # ─────────────────────────────────────────────
      #  Сохранение артефактов (архив для скачивания)
      # ─────────────────────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk-v${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # ─────────────────────────────────────────────
      #  Публикация в Releases
      # ─────────────────────────────────────────────
      - name: Create or update Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Тег $TAG уже существует — обновляю"
            git tag -f "$TAG"
            git push origin -f "$TAG"
          else
            echo "✅ Создаю новый тег $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            ## 📦 APK для всех архитектур

            **Версия:** ${{ steps.version.outputs.version }}
            **Сборка:** ${{ github.run_number }}

            ### Файлы

            | Архитектура | Для чего |
            |-------------|----------|
            | `app-arm64-v8a-release.apk` | Современные телефоны (берите этот) |
            | `app-armeabi-v7a-release.apk` | Старые 32-битные устройства |
            | `app-x86_64-release.apk` | Эмуляторы и планшеты x86 |

            ### Установка

            1. Скачайте `app-arm64-v8a-release.apk`
            2. Разрешите установку из неизвестных источников
            3. Установите APK
          files: dist/*.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
          draft: false
          prerelease: false
